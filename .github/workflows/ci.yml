name: LHR CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust engine
        working-directory: rust
        run: cargo test --release
      - name: Test release engine under 1 GiB virtual-memory ceiling
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          cargo test --release
      - name: Packed Hybrid-7 1M benchmark
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          cargo run --release --bin scale -- 1000000 100000 200 512 hybrid7 | tee packed-hybrid-1m.json
          cat packed-hybrid-1m.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          d=json.load(open('packed-hybrid-1m.json'))
          assert d['exact']=='10/10', d
          assert d['median_pct_touched']==0.0 and d['p95_pct_touched']==0.0, d
          assert d['index_amplification'] < 1.6, d
          PY
      - name: Topology-aware Hybrid-7 1M benchmark
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          cargo run --release --bin topology -- 1000000 2 | tee topology-1m.json
          cat topology-1m.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          d=json.load(open('topology-1m.json'))
          assert d['exact']=='24/24', d
          assert 'w2_direct_pair' in d['routes'], d
          assert 'w2_singleton_only' in d['routes'], d
          PY
      - name: Mixed-cardinality adaptive 1M benchmark
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          cargo run --release --bin mixed_scale -- 1000000 120 | tee mixed-1m.json
          cat mixed-1m.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          d=json.load(open('mixed-1m.json'))
          assert d['exact']=='10/10', d
          assert d['kinds']['0']=='bitslice', d
          PY
      - name: Packed Hybrid comparison sweep
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          : > packed-hybrid-sweep.jsonl
          for profile in hybrid7 hybrid12 hybrid16 exactpairs; do
            cargo run --release --bin scale -- 1000000 100000 120 512 "$profile" | tee -a packed-hybrid-sweep.jsonl
          done
          cat packed-hybrid-sweep.jsonl >> "$GITHUB_STEP_SUMMARY"
      - name: Packed Hybrid-7 10M stress benchmark with 1 GiB RSS gate
        working-directory: rust
        shell: bash
        run: |
          cargo run --release --bin scale -- 10000000 100000 100 1024 hybrid7 | tee packed-hybrid-10m.json
          cat packed-hybrid-10m.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          d=json.load(open('packed-hybrid-10m.json'))
          assert d['exact']=='10/10', d
          assert d['median_pct_touched']==0.0 and d['p95_pct_touched']==0.0, d
          assert d['hwm_kb'] < 1048576, d
          assert d['index_amplification'] < 1.6, d
          PY
      - name: Topology-aware Hybrid-7 10M benchmark
        working-directory: rust
        shell: bash
        run: |
          cargo run --release --bin topology -- 10000000 1 | tee topology-10m.json
          cat topology-10m.json >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json
          d=json.load(open('topology-10m.json'))
          assert d['exact']=='24/24', d
          assert 'w2_direct_pair' in d['routes'], d
          assert 'w2_singleton_only' in d['routes'], d
          PY
