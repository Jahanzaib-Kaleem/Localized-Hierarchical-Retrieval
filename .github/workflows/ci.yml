name: LHR CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust engine
        working-directory: rust
        run: cargo test --release
      - name: Test release engine under 1 GiB virtual-memory ceiling
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          cargo test --release
      - name: End-to-end 1M-row benchmark under 1 GiB ceiling
        working-directory: rust
        shell: bash
        run: |
          ulimit -v 1048576
          cargo run --release --bin scale -- 1000000 100000 100 | tee benchmark.json
          cat benchmark.json >> "$GITHUB_STEP_SUMMARY"
