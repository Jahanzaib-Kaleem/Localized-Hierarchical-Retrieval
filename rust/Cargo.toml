[package]
name = "lhr"
version = "0.1.0"
edition = "2021"
description = "Localized Hierarchical Retrieval engine"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
