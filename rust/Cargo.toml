[package]
name = "lhr"
version = "0.1.0"
edition = "2021"
description = "Localized Hierarchical Retrieval engine"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
fs2 = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
