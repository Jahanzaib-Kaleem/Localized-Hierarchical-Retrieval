services:
  lhr:
    image: ghcr.io/jahanzaib-kaleem/lhr:latest
    pull_policy: always
    container_name: lhr
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LHR_STUDIO_PORT:-8787}:8787"
      - "127.0.0.1:${LHR_MCP_PORT:-8788}:8788"
    volumes:
      - lhr-data:/data
      - sandbox-control:/data/control/sandbox

  sandbox:
    image: ghcr.io/jahanzaib-kaleem/lhr:latest
    pull_policy: always
    container_name: lhr-sandbox
    restart: unless-stopped
    entrypoint: ["/usr/bin/python3", "-u", "/usr/local/lib/lhr/sandbox_worker.py"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m"]
    environment:
      HOME: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - sandbox-control:/control
      - sandbox-workspace:/workspace

volumes:
  lhr-data:
    name: ${LHR_DATA_VOLUME:-lhr-data}
  sandbox-control:
    name: ${LHR_SANDBOX_CONTROL_VOLUME:-lhr-sandbox-control}
  sandbox-workspace:
    name: ${LHR_SANDBOX_VOLUME:-lhr-sandbox-workspace}
